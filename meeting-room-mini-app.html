<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TC Acoustic — Room booking</title>
<style>
  :root {
    --border: #e5e3dc;
    --border-strong: #cfccc2;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a64;
    --text-muted: #9a988f;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --danger-bg: #fcebeb;
    --danger-border: #e24b4a;
    --danger-text: #a32d2d;
    --sel-bg: #e6f1fb;
    --sel-border: #378add;
    --sel-text: #0c447c;
  }
  * { box-sizing: border-box; }
  .page-title {
    font-size: 20px;
    font-weight: 500;
    text-align: center;
    margin: 0 0 14px;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 16px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .date-nav button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    font-size: 15px;
    color: var(--text-primary);
    cursor: pointer;
  }
  .date-nav input[type="date"] {
    font-size: 13px;
    border: 0.5px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 8px;
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: inherit;
  }
  .date-label {
    font-size: 15px;
    font-weight: 500;
  }
  .view-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 0.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 3px;
    margin-bottom: 12px;
    width: fit-content;
  }
  .view-toggle button {
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
  }
  .view-toggle button.active {
    background: var(--text-primary);
    color: #fff;
  }
  .room-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .room-tab {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 20px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .room-tab .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .room-tab.active {
    color: #fff;
    border-color: transparent;
  }
  .card {
    background: var(--surface-2);
    border-radius: 12px;
    border: 0.5px solid var(--border);
    padding: 12px;
  }
  .scroll-x {
    overflow-x: auto;
  }

  /* ---- Day view: 3 room columns side by side ---- */
  .day-grid {
    display: grid;
    grid-template-columns: 40px repeat(3, minmax(100px, 1fr));
    min-width: 340px;
  }
  .day-header-row {
    display: grid;
    grid-template-columns: 40px repeat(3, minmax(100px, 1fr));
    min-width: 340px;
    margin-bottom: 2px;
  }
  .col-header {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 2px;
    border-radius: 6px 6px 0 0;
    white-space: nowrap;
  }
  .col-header .pax-line {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 400;
    opacity: 0.8;
  }
  .time-col { display: grid; }
  .time-label { font-size: 11px; color: var(--text-muted); }
  .drag-col {
    position: relative;
    border-left: 0.5px solid var(--border);
    touch-action: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .bg-rows { display: grid; pointer-events: none; }
  .bg-rows > div { border-bottom: 0.5px dashed var(--border); }
  .bg-rows > div.hour { border-bottom: 0.5px solid var(--border); }
  .block {
    position: absolute;
    left: 3px;
    right: 3px;
    border-radius: 6px;
    padding: 3px 5px;
    pointer-events: none;
    overflow: hidden;
  }
  .block-selection { background: var(--sel-bg); border-left: 3px solid var(--sel-border); }
  .block-selection.conflict { background: var(--danger-bg); border-left: 3px solid var(--danger-border); }
  .block-title { font-size: 10.5px; font-weight: 500; line-height: 1.3; }
  .block-sub { font-size: 10.5px; line-height: 1.3; }
  .block-selection .block-title, .block-selection .block-sub { color: var(--sel-text); }
  .block-selection.conflict .block-title, .block-selection.conflict .block-sub { color: var(--danger-text); }

  .hint { font-size: 12px; color: var(--text-muted); margin: 10px 0 0; }
  .confirm-btn {
    width: 100%;
    margin-top: 10px;
    height: 44px;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    background: var(--text-primary);
    color: #fff;
    display: none;
  }
  .confirm-btn:disabled { opacity: 0.5; }

  /* ---- Week view ---- */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 76px);
    gap: 8px;
    min-width: 560px;
  }
  .week-day {
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 6px;
    cursor: pointer;
    background: var(--surface-2);
  }
  .week-day.today { border: 0.5px solid var(--text-primary); }
  .week-day-label { font-size: 11px; color: var(--text-muted); text-align: center; }
  .week-day-num { font-size: 15px; font-weight: 500; text-align: center; margin-bottom: 6px; }
  .week-booking {
    font-size: 10px;
    border-radius: 4px;
    padding: 3px 4px;
    margin-bottom: 3px;
    line-height: 1.3;
  }
  .week-empty { font-size: 11px; color: var(--text-muted); text-align: center; padding-top: 8px; }

  /* ---- Month view ---- */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .month-dow {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 4px 0;
  }
  .month-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-size: 12px;
  }
  .month-cell.today { border: 0.5px solid var(--text-primary); }
  .month-cell.other-month { color: var(--text-muted); }
  .month-dots { display: flex; gap: 2px; }
  .month-dots span { width: 5px; height: 5px; border-radius: 50%; }

  .day-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .date-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    flex: 1;
  }
  .date-chip {
    flex: 0 0 auto;
    width: 42px;
    padding: 6px 0;
    border-radius: 10px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    text-align: center;
    cursor: pointer;
  }
  .date-chip .dc-dow { font-size: 10px; color: var(--text-muted); }
  .date-chip .dc-num { font-size: 14px; font-weight: 500; margin-top: 2px; }
  .date-chip.active { background: var(--text-primary); border-color: var(--text-primary); }
  .date-chip.active .dc-dow, .date-chip.active .dc-num { color: #fff; }
  .date-chip.today:not(.active) { border-color: var(--text-primary); }

  .new-booking-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
    padding: 7px 12px;
    border-radius: 20px;
    border: none;
    background: var(--text-primary);
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1 class="page-title">TC Room Booking</h1>

<div class="top-row">
  <div class="date-nav">
    <button id="prevBtn" aria-label="Previous">‹</button>
    <input type="date" id="datePicker">
    <button id="nextBtn" aria-label="Next">›</button>
  </div>
  <div class="date-label" id="dateLabel"></div>
</div>

<div class="view-toggle" id="viewToggle">
  <button data-view="day" class="active">Day</button>
  <button data-view="week">Week</button>
  <button data-view="month">Month</button>
</div>

<div class="room-tabs" id="roomTabs" style="display:none;"></div>

<!-- DAY VIEW: all 3 rooms side by side, scrollable, drag-to-book -->
<div id="dayView">
  <div class="day-toolbar">
    <div class="date-strip" id="dateStrip"></div>
    <div class="new-booking-btn" id="newBookingBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      New
    </div>
  </div>
  <div class="card scroll-x">
    <div class="day-header-row" id="dayHeaderRow"></div>
    <div class="day-grid" id="dayGrid">
      <div class="time-col" id="timeCol"></div>
    </div>
  </div>
  <p class="hint">Press and drag down on a room's column to set start and end time.</p>
  <button class="confirm-btn" id="confirmBtn">Confirm booking</button>
</div>

<!-- WEEK VIEW: one room at a time, 7 day columns, scrollable, tap a day to open it -->
<div id="weekView" class="card scroll-x" style="display:none;">
  <div class="week-grid" id="weekGrid"></div>
</div>

<!-- MONTH VIEW: calendar grid, dot per room with a booking that day, tap to open day view -->
<div id="monthView" class="card" style="display:none;">
  <div class="month-grid" id="monthGrid"></div>
</div>

<script>
// ---- Config ----
const ROW_MIN = 15;
const ROW_H = 22;
const GRID_START_MIN = 16 * 60;  // 4:00 PM
const GRID_END_MIN = 19 * 60;    // 7:00 PM
const ROWS = (GRID_END_MIN - GRID_START_MIN) / ROW_MIN;

const ROOMS = [
  { name: "Glass conference room", short: "Glass conf.", bg: "#e1f5ee", border: "#1d9e75", text: "#085041", capacity: 15 },
  { name: "Glass meeting room",    short: "Glass mtg.",  bg: "#faece7", border: "#d85a30", text: "#712b13", capacity: 6 },
  { name: "External conference room", short: "External", bg: "#eeedfe", border: "#7f77dd", text: "#3c3489", capacity: 8 }
];

const PAX_ICON = '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:2px;"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';

function roomInfo(name) { return ROOMS.find(r => r.name === name); }
function fmt(totalMin) {
  let h = Math.floor(totalMin / 60), m = totalMin % 60;
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ":" + String(m).padStart(2, "0") + " " + ap;
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate() + n); return c; }
function sameDay(a, b) { return isoDate(a) === isoDate(b); }

// ---- Sample data, keyed by date -> room -> [{start,end,title}] ----
// Replace with a Supabase fetch for the visible date range.
const today = new Date();
const bookingsData = {};
function addSample(dayOffset, room, start, end, title) {
  const key = isoDate(addDays(today, dayOffset));
  bookingsData[key] = bookingsData[key] || {};
  bookingsData[key][room] = bookingsData[key][room] || [];
  bookingsData[key][room].push({ start, end, title });
}
addSample(0, "Glass meeting room", 16 * 60 + 30, 17 * 60, "Weekly sync");
addSample(0, "External conference room", 17 * 60, 18 * 60, "Client call");
addSample(1, "Glass conference room", 16 * 60, 16 * 60 + 45, "Vendor demo");
addSample(3, "Glass meeting room", 17 * 60 + 15, 18 * 60, "Ops review");
addSample(3, "Glass conference room", 16 * 60, 17 * 60, "Interview");

function getBookings(date, room) {
  const key = isoDate(date);
  return (bookingsData[key] && bookingsData[key][room]) || [];
}
function overlaps(date, room, startMin, endMin) {
  return getBookings(date, room).some(b => startMin < b.end && endMin > b.start);
}

// ---- State ----
let currentView = "day";
let activeDate = new Date(today);
let activeRoom = ROOMS[0].name; // used by week view

// ---- Date nav ----
const datePicker = document.getElementById("datePicker");
const dateLabel = document.getElementById("dateLabel");

function renderDateLabel() {
  if (currentView === "day") {
    dateLabel.textContent = activeDate.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  } else if (currentView === "week") {
    const start = startOfWeek(activeDate);
    const end = addDays(start, 6);
    dateLabel.textContent = start.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " – " + end.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  } else {
    dateLabel.textContent = activeDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
}
function startOfWeek(d) {
  const c = new Date(d);
  const day = c.getDay(); // 0 = Sun
  c.setDate(c.getDate() - day);
  return c;
}
datePicker.addEventListener("change", () => {
  activeDate = new Date(datePicker.value + "T00:00:00");
  renderAll();
});
document.getElementById("prevBtn").addEventListener("click", () => {
  const step = currentView === "month" ? 30 : currentView === "week" ? 7 : 1;
  activeDate = addDays(activeDate, -step);
  renderAll();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  const step = currentView === "month" ? 30 : currentView === "week" ? 7 : 1;
  activeDate = addDays(activeDate, step);
  renderAll();
});

// ---- View toggle ----
document.getElementById("viewToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-view]");
  if (!btn) return;
  document.querySelectorAll(".view-toggle button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentView = btn.dataset.view;
  document.getElementById("dayView").style.display = currentView === "day" ? "block" : "none";
  document.querySelector(".day-toolbar").style.display = currentView === "day" ? "flex" : "none";
  document.getElementById("weekView").style.display = currentView === "week" ? "block" : "none";
  document.getElementById("monthView").style.display = currentView === "month" ? "block" : "none";
  document.getElementById("roomTabs").style.display = currentView === "week" ? "flex" : "none";
  renderAll();
});

// ---- Room tabs (week view only) ----
const roomTabsEl = document.getElementById("roomTabs");
ROOMS.forEach(room => {
  const tab = document.createElement("button");
  tab.className = "room-tab" + (room.name === activeRoom ? " active" : "");
  tab.style.background = room.name === activeRoom ? room.border : "";
  tab.innerHTML = `<span class="dot" style="background:${room.border}"></span>${room.short}`;
  tab.addEventListener("click", () => {
    document.querySelectorAll(".room-tab").forEach(t => { t.classList.remove("active"); t.style.background = ""; });
    tab.classList.add("active");
    tab.style.background = room.border;
    activeRoom = room.name;
    renderWeekView();
  });
  roomTabsEl.appendChild(tab);
});

// ==================== DAY VIEW ====================
function buildDayView() {
  const headerRow = document.getElementById("dayHeaderRow");
  const dayGrid = document.getElementById("dayGrid");
  headerRow.innerHTML = "<div></div>";
  dayGrid.innerHTML = "";

  const timeCol = document.createElement("div");
  timeCol.className = "time-col";
  timeCol.style.gridTemplateRows = `repeat(${ROWS}, ${ROW_H}px)`;
  for (let i = 0; i < ROWS; i++) {
    const min = GRID_START_MIN + i * ROW_MIN;
    const label = document.createElement("div");
    label.className = "time-label";
    label.textContent = (min % 60 === 0) ? fmt(min) : "";
    timeCol.appendChild(label);
  }
  dayGrid.appendChild(timeCol);

  ROOMS.forEach((room, idx) => {
    const header = document.createElement("div");
    header.className = "col-header";
    header.style.background = room.bg;
    header.style.color = room.text;
    header.innerHTML = `<span>${room.short}</span><span class="pax-line">${PAX_ICON}${room.capacity}</span>`;
    headerRow.appendChild(header);

    const col = document.createElement("div");
    col.className = "drag-col";
    col.dataset.room = room.name;

    const bgRows = document.createElement("div");
    bgRows.className = "bg-rows";
    bgRows.style.gridTemplateRows = `repeat(${ROWS}, ${ROW_H}px)`;
    for (let i = 0; i < ROWS; i++) {
      const row = document.createElement("div");
      const min = GRID_START_MIN + i * ROW_MIN;
      if (min % 60 === 0) row.className = "hour";
      bgRows.appendChild(row);
    }
    col.appendChild(bgRows);

    const bookedWrap = document.createElement("div");
    bookedWrap.className = "booked-wrap";
    col.appendChild(bookedWrap);

    const selBlock = document.createElement("div");
    selBlock.className = "block block-selection";
    selBlock.style.display = "none";
    selBlock.innerHTML = `<div class="block-title"></div>`;
    col.appendChild(selBlock);

    dayGrid.appendChild(col);
  });
}

function renderDayBookings() {
  document.querySelectorAll(".drag-col").forEach(col => {
    const room = col.dataset.room;
    const info = roomInfo(room);
    const wrap = col.querySelector(".booked-wrap");
    wrap.innerHTML = "";
    getBookings(activeDate, room).forEach(b => {
      const top = ((b.start - GRID_START_MIN) / ROW_MIN) * ROW_H;
      const height = ((b.end - b.start) / ROW_MIN) * ROW_H;
      const el = document.createElement("div");
      el.className = "block";
      el.style.top = top + "px";
      el.style.height = height + "px";
      el.style.background = info.bg;
      el.style.borderLeft = `3px solid ${info.border}`;
      el.innerHTML = `<div class="block-title" style="color:${info.text}">${fmt(b.start)}–${fmt(b.end)}</div><div class="block-sub" style="color:${info.text}">${b.title}</div>`;
      wrap.appendChild(el);
    });
    col.querySelector(".block-selection").style.display = "none";
  });
  document.getElementById("confirmBtn").style.display = "none";
}

// Drag-to-select, delegated across all room columns
let dragCol = null, startRow = null, dragging = false;
function rowFromY(col, y) {
  const rect = col.getBoundingClientRect();
  return Math.max(0, Math.min(ROWS - 1, Math.floor((y - rect.top) / ROW_H)));
}
function clearOtherSelections(except) {
  document.querySelectorAll(".drag-col").forEach(c => {
    if (c !== except) c.querySelector(".block-selection").style.display = "none";
  });
}
function updateSelection(col, r1, r2) {
  const room = col.dataset.room;
  const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
  const startMin = GRID_START_MIN + lo * ROW_MIN;
  const endMin = GRID_START_MIN + (hi + 1) * ROW_MIN;
  const selBlock = col.querySelector(".block-selection");
  selBlock.style.top = (lo * ROW_H) + "px";
  selBlock.style.height = ((hi - lo + 1) * ROW_H) + "px";
  selBlock.style.display = "block";
  const conflict = overlaps(activeDate, room, startMin, endMin);
  selBlock.classList.toggle("conflict", conflict);
  selBlock.querySelector(".block-title").textContent = fmt(startMin) + "–" + fmt(endMin);

  const confirmBtn = document.getElementById("confirmBtn");
  confirmBtn.style.display = "block";
  confirmBtn.disabled = conflict;
  confirmBtn.textContent = conflict ? "Overlaps an existing booking" : `Confirm ${roomInfo(room).short} booking`;
  confirmBtn.dataset.room = room;
  confirmBtn.dataset.start = startMin;
  confirmBtn.dataset.end = endMin;
}
function onDown(e) {
  const col = e.target.closest(".drag-col");
  if (!col) return;
  dragging = true;
  dragCol = col;
  clearOtherSelections(col);
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  startRow = rowFromY(col, y);
  updateSelection(col, startRow, startRow);
}
function onMove(e) {
  if (!dragging || !dragCol) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  updateSelection(dragCol, startRow, rowFromY(dragCol, y));
}
function onUp() { dragging = false; }

document.getElementById("dayGrid").addEventListener("mousedown", onDown);
document.getElementById("dayGrid").addEventListener("touchstart", onDown, { passive: true });
window.addEventListener("mousemove", onMove);
window.addEventListener("touchmove", onMove, { passive: true });
window.addEventListener("mouseup", onUp);
window.addEventListener("touchend", onUp);

document.getElementById("confirmBtn").addEventListener("click", () => {
  const btn = document.getElementById("confirmBtn");
  if (btn.disabled) return;
  alert(`Booked "${btn.dataset.room}" on ${isoDate(activeDate)} from ${fmt(Number(btn.dataset.start))} to ${fmt(Number(btn.dataset.end))}`);
});

// ==================== WEEK VIEW ====================
function renderWeekView() {
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";
  const start = startOfWeek(activeDate);
  const info = roomInfo(activeRoom);
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const cell = document.createElement("div");
    cell.className = "week-day" + (sameDay(d, today) ? " today" : "");
    cell.innerHTML = `<div class="week-day-label">${d.toLocaleDateString(undefined, { weekday: "short" })}</div><div class="week-day-num">${d.getDate()}</div>`;
    const bookings = getBookings(d, activeRoom);
    if (bookings.length === 0) {
      cell.innerHTML += `<div class="week-empty">—</div>`;
    } else {
      bookings.forEach(b => {
        const b_el = document.createElement("div");
        b_el.className = "week-booking";
        b_el.style.background = info.bg;
        b_el.style.color = info.text;
        b_el.textContent = fmt(b.start) + " " + b.title;
        cell.appendChild(b_el);
      });
    }
    cell.addEventListener("click", () => {
      activeDate = d;
      document.querySelector('.view-toggle button[data-view="day"]').click();
    });
    grid.appendChild(cell);
  }
}

// ==================== MONTH VIEW ====================
function renderMonthView() {
  const grid = document.getElementById("monthGrid");
  grid.innerHTML = "";
  ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(d => {
    const el = document.createElement("div");
    el.className = "month-dow";
    el.textContent = d;
    grid.appendChild(el);
  });
  const monthStart = new Date(activeDate.getFullYear(), activeDate.getMonth(), 1);
  const gridStart = startOfWeek(monthStart);
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i);
    const cell = document.createElement("div");
    const inMonth = d.getMonth() === activeDate.getMonth();
    cell.className = "month-cell" + (sameDay(d, today) ? " today" : "") + (inMonth ? "" : " other-month");
    const dotsWrap = document.createElement("div");
    dotsWrap.className = "month-dots";
    ROOMS.forEach(room => {
      if (getBookings(d, room.name).length > 0) {
        const dot = document.createElement("span");
        dot.style.background = room.border;
        dotsWrap.appendChild(dot);
      }
    });
    cell.innerHTML = `<div>${d.getDate()}</div>`;
    cell.appendChild(dotsWrap);
    cell.addEventListener("click", () => {
      activeDate = d;
      document.querySelector('.view-toggle button[data-view="day"]').click();
    });
    grid.appendChild(cell);
  }
}

// ---- Date strip (day view): tap to jump to a nearby day without leaving Day view ----
function renderDateStrip() {
  const strip = document.getElementById("dateStrip");
  strip.innerHTML = "";
  for (let offset = -3; offset <= 3; offset++) {
    const d = addDays(activeDate, offset);
    const chip = document.createElement("div");
    chip.className = "date-chip" + (offset === 0 ? " active" : "") + (sameDay(d, today) ? " today" : "");
    chip.innerHTML = `<div class="dc-dow">${d.toLocaleDateString(undefined, { weekday: "short" })}</div><div class="dc-num">${d.getDate()}</div>`;
    chip.addEventListener("click", () => {
      activeDate = d;
      renderAll();
    });
    strip.appendChild(chip);
  }
}

document.getElementById("newBookingBtn").addEventListener("click", () => {
  const card = document.querySelector("#dayView .card");
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.style.transition = "box-shadow 0.15s";
  card.style.boxShadow = "0 0 0 2px var(--sel-border)";
  setTimeout(() => { card.style.boxShadow = "none"; }, 900);
});

// ---- Render dispatch ----
function renderAll() {
  datePicker.value = isoDate(activeDate);
  renderDateLabel();
  if (currentView === "day") { renderDateStrip(); renderDayBookings(); }
  else if (currentView === "week") renderWeekView();
  else renderMonthView();
}

buildDayView();
renderAll();
</script>
